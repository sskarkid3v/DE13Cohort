version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: stg_accounts
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: customer_id
        tests: 
          - relationships:
              to: ref('stg_customers')
              field: customer_id
  - name: stg_transactions
    colmns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: account_id
        tests: 
          - relationships:
              to: ref('stg_accounts')
              field: account_id